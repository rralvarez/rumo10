name: Cron POC - synthetic artifact only
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-poc-synthetic-artifact
  cancel-in-progress: false
jobs:
  create-synthetic-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate and verify synthetic text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'rumo-cron-poc' / 'synthetic.txt'
          target.parent.mkdir(exist_ok=True)
          payload = b'RUMO_CRON_POC_SYNTHETIC_V1\n'
          expected = 'd1dcc307658ac6a9e5e2f520b9a2e80cae51f0e93e7ce369262cbc51f4ec0d3e'
          target.write_bytes(payload)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          print('Synthetic payload SHA-256: ' + expected)
          PY
      - name: Upload synthetic artifact only
        id: synthetic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumo-cron-poc-synthetic-v1
          path: ${{ runner.temp }}/rumo-cron-poc/synthetic.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Record identifiers without credentials
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.synthetic.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.synthetic.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARCHIVE_SHA256"
          printf 'Commit: %s\nRun: %s\nArtifact ID: %s\nArchive SHA-256: %s\nPayload SHA-256: d1dcc307658ac6a9e5e2f520b9a2e80cae51f0e93e7ce369262cbc51f4ec0d3e\n' "$COMMIT_SHA" "$RUN_ID" "$ARTIFACT_ID" "$ARCHIVE_SHA256" >> "$GITHUB_STEP_SUMMARY"
