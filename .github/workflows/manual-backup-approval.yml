name: Rumo10 manual backup approval
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  pull-requests: read
  issues: read
jobs:
  confirm:
    if: >-
      github.repository == 'rralvarez/rumo10' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'RUMO10 BACKUP CONFIRMADO E MERGE AUTORIZADO PR #') &&
      format('{0}', github.event.comment.user.id) == vars.RUMO10_OWNER_ID
    runs-on: ubuntu-latest
    environment: rumo10-backup-approval
    steps:
      - name: Validate the owner statement, current PR head and preceding CI
        id: confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pr=$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")
          id=$(jq -er '.comment.id' "$GITHUB_EVENT_PATH")
          gh api "repos/$repo/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          gh api "repos/$repo/issues/comments/$id" > "$RUNNER_TEMP/comment.json"
          jq -e --arg repo "$repo" '.state == "open" and .base.ref == "main" and .base.repo.full_name == $repo' "$RUNNER_TEMP/pr.json" > /dev/null
          head=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pr.json")
          statement="RUMO10 BACKUP CONFIRMADO E MERGE AUTORIZADO PR #$pr HEAD $head"
          owner=$(jq -er '.comment.user.id' "$GITHUB_EVENT_PATH")
          jq -e --arg statement "$statement" --argjson owner "$owner" \
            '.body == $statement and .user.id == $owner and .user.type == "User" and .performed_via_github_app == null and .created_at == .updated_at' \
            "$RUNNER_TEMP/comment.json" > /dev/null
          confirmed=$(jq -er '.created_at' "$RUNNER_TEMP/comment.json")
          url="repos/$repo/actions/workflows/production-consolidated.yml/runs?event=pull_request&head_sha=$head&per_page=100"
          gh api "$url" | jq -er --arg head "$head" --argjson pr "$pr" --arg confirmed "$confirmed" '
            .workflow_runs | map(select(.head_sha == $head and .conclusion == "success"
              and .updated_at <= $confirmed and any(.pull_requests[]?; .number == $pr)))
            | if length > 0 then .[0].id else error("No preceding approved CI for this PR and head") end' > /dev/null
          printf 'head=%s\npr=%s\nid=%s\n' "$head" "$pr" "$id" >> "$GITHUB_OUTPUT"
      - name: Issue a token limited to this repository and commit statuses
        id: app
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b
        with:
          app-id: ${{ vars.RUMO10_BACKUP_APP_ID }}
          private-key: ${{ secrets.RUMO10_BACKUP_APP_KEY }}
          permission-statuses: write
      - name: Register the required check against the exact approved head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.confirmation.outputs.head }}
          PR: ${{ steps.confirmation.outputs.pr }}
          COMMENT_ID: ${{ steps.confirmation.outputs.id }}
        run: |
          set -euo pipefail
          GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
            jq -e --arg head "$HEAD" '.state == "open" and .base.ref == "main" and .head.sha == $head' > /dev/null
          GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls?per_page=100" |
            jq -e --arg head "$HEAD" --argjson pr "$PR" '
              map(select(.state == "open" and .base.ref == "main" and .head.sha == $head))
              | length == 1 and .[0].number == $pr' > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
            -f state=success -f context=rumo10/manual-backup \
            -f description="Owner confirmed manual backup and authorized merge of PR #$PR" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/pull/$PR#issuecomment-$COMMENT_ID" > /dev/null
